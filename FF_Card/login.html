<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freedom Bank · закрытые материалы</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="access-page"><main class="access-shell"><p class="eyebrow">Freedom Bank · закрытая инструкция</p><h1>Материалы по доступу</h1><p class="lead">Введите персональный код доступа. После активации он действует 12 часов.</p>
<section class="access-card" aria-labelledby="pin-title"><h2 id="pin-title">Вход по коду</h2><form id="pin-form" novalidate><label for="pin">Код доступа</label><input id="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="0000-0000-0000" maxlength="14" aria-describedby="pin-help" required><p id="pin-help" class="hint">12 цифр; дефисы можно не вводить.</p><p class="form-message" id="pin-message" role="alert"></p><a id="active-session-link" class="button primary" hidden></a><button class="button primary" id="pin-submit" type="submit" disabled>Открыть материалы</button></form><a class="button telegram" href="https://t.me/SmitAnin?text=%D0%9A%D0%A0%D0%90%D0%A2%D0%90" target="_blank" rel="noopener">Запросить доступ к материалам</a></section>
<details class="admin-disclosure" id="admin-disclosure"><summary>Вход администратора</summary><form id="admin-form" novalidate><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><p class="form-message" id="admin-message" role="alert"></p><button class="button secondary" id="admin-submit" type="submit" disabled>Войти в панель</button></form></details>
</main><script src="/assets/app.js" defer></script></body></html>
